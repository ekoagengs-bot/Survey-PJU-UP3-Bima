<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f5f7fa;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px #0001}.n{font-size:28px;font-weight:bold}table{width:100%;background:#fff;border-collapse:collapse;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}a{color:#1261a0}</style></head><body><div class="wrap"><h2>📊 Dashboard Pemeriksaan PJU</h2><div class="cards"><div class="card">Total<div id="total" class="n">-</div></div><div class="card">Baik<div id="baik" class="n">-</div></div><div class="card">Rusak Ringan<div id="rr" class="n">-</div></div><div class="card">Rusak Berat<div id="rb" class="n">-</div></div><div class="card">Mati<div id="mati" class="n">-</div></div><div class="card">Tindak Lanjut<div id="tl" class="n">-</div></div></div><table><thead><tr><th>ID</th><th>Tanggal</th><th>Petugas</th><th>Unit</th><th>Tiang</th><th>Status</th><th>Prioritas</th><th>Link</th></tr></thead><tbody id="rows"></tbody></table></div><script>google.script.run.withSuccessHandler(d=>{total.textContent=d.total;baik.textContent=d.baik;rr.textContent=d.rusakRingan;rb.textContent=d.rusakBerat;mati.textContent=d.mati;tl.textContent=d.tindakLanjut;rows.innerHTML=d.rows.map(r=>`<tr><td>${r.id}</td><td>${r.tanggal}</td><td>${r.petugas}</td><td>${r.unit}</td><td>${r.tiang}</td><td>${r.status}</td><td>${r.prioritas}</td><td>${r.maps?'<a target="_blank" href="'+r.maps+'">Maps</a>':''} ${r.foto?'<a target="_blank" href="'+r.foto+'">Foto</a>':''}</td></tr>`).join('')}).getDashboardData();</script></body></html>
