name: Build PJU Inspection PRO APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.7
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build release APK
        run: ./gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk PJU-Inspection-PRO.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PJU-Inspection-PRO
          path: PJU-Inspection-PRO.apk
          if-no-files-found: error
