name: Build PJU Inspection PRO APK
on:
  push:
    branches: ["apk-ready"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
      - name: Build APK
        run: ./gradle-8.7/bin/gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PJU-Inspection-PRO
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
