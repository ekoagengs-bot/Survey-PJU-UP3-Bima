<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#17202a}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}label{font-weight:700;display:block;margin:12px 0 5px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}textarea{min-height:80px}button{background:#146c43;color:white;border:0;font-weight:700;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:8px}.ok{background:#e8f7ee;padding:12px;border-radius:9px}.err{background:#fdecec;padding:12px;border-radius:9px}.small{font-size:12px;color:#667085}.hidden{display:none}</style></head><body><div class="wrap"><h2>📍 Pemeriksaan PJU</h2><div id="msg"></div><div class="card"><label>Petugas</label><select id="petugas"><option>Memuat...</option></select><label>Cari PJU / Tiang</label><input id="search" placeholder="Nomor tiang, gardu, alamat..." oninput="cari()"><select id="hasil" onchange="pilih(this.value)"><option value="">Pilih data PJU</option></select><div class="grid"><div><label>Unit</label><input id="unit"></div><div><label>Gardu</label><input id="gardu"></div></div><label>Alamat</label><input id="alamat"><label>Tiang</label><input id="tiang"><label>Jenis Lampu</label><input id="jenisLampu"><div class="grid"><div><label>Daya 1</label><input id="daya1"></div><div><label>Daya 2</label><input id="daya2"></div><div><label>Daya 3</label><input id="daya3"></div><div><label>Daya 4</label><input id="daya4"></div><div><label>Daya 5</label><input id="daya5"></div></div><button type="button" onclick="ambilGPS()">📍 Ambil Koordinat GPS</button><div id="gps" class="small">Belum mengambil lokasi</div></div><div class="card"><label>Status PJU</label><select id="statusPju"><option>BAIK</option><option>RUSAK RINGAN</option><option>RUSAK BERAT</option><option>MATI</option></select><div class="grid"><div><label>Kondisi Lampu</label><select id="kondisiLampu"><option>BAIK</option><option>RUSAK</option><option>MATI</option></select></div><div><label>Kondisi Armatur</label><select id="kondisiArmatur"><option>BAIK</option><option>RUSAK</option></select></div><div><label>Kondisi Tiang</label><select id="kondisiTiang"><option>BAIK</option><option>RUSAK</option></select></div><div><label>Kondisi Kabel</label><select id="kondisiKabel"><option>BAIK</option><option>RUSAK</option></select></div><div><label>Kondisi Gardu</label><select id="kondisiGardu"><option>BAIK</option><option>RUSAK</option></select></div><div><label>Prioritas</label><select id="prioritas"><option>RENDAH</option><option>SEDANG</option><option>TINGGI</option><option>URGENT</option></select></div></div><label>Temuan</label><textarea id="temuan"></textarea><label>Tindak Lanjut</label><textarea id="tindakLanjut"></textarea><label>Status Pekerjaan</label><select id="statusPekerjaan"><option>BELUM DIPROSES</option><option>DALAM PROSES</option><option>SELESAI</option></select><label>Keterangan</label><textarea id="keterangan"></textarea></div><div class="card"><label>📷 Foto Utama PJU (wajib)</label><input id="fotoUtama" type="file" accept="image/*" capture="environment" onchange="preview(this,'p1')"><img id="p1" class="preview hidden"><label>📷 Foto Panel/Gardu</label><input id="fotoPanel" type="file" accept="image/*" capture="environment" onchange="preview(this,'p2')"><img id="p2" class="preview hidden"><label>📷 Foto Perbaikan</label><input id="fotoPerbaikan" type="file" accept="image/*" capture="environment" onchange="preview(this,'p3')"><img id="p3" class="preview hidden"><button type="button" onclick="simpan()">💾 SIMPAN PEMERIKSAAN</button></div></div><script>let master=[],lat='',lon='';const $=id=>document.getElementById(id);function msg(t,c='ok'){ $('msg').innerHTML='<div class="'+c+'">'+t+'</div>';window.scrollTo(0,0)}function load(){google.script.run.withSuccessHandler(d=>{master=d;}).getMasterPJU();google.script.run.withSuccessHandler(d=>{$('petugas').innerHTML='<option value="">Pilih petugas</option>'+d.map(x=>`<option value="${x.nama}">${x.nama} - ${x.unit}</option>`).join('')}).getPetugas()}function cari(){let q=$('search').value.toLowerCase();let a=master.filter(x=>[x.id,x.unit,x.alamat,x.gardu,x.tiang].join(' ').toLowerCase().includes(q)).slice(0,20);$('hasil').innerHTML='<option value="">Pilih data PJU</option>'+a.map(x=>`<option value="${x.id}">${x.tiang||x.id} | ${x.alamat||''}</option>`).join('')}function pilih(id){let x=master.find(z=>z.id===id);if(!x)return;['unit','alamat','gardu','tiang','jenisLampu','daya1','daya2','daya3','daya4','daya5'].forEach(k=>$(k).value=x[k]||'');if(x.koordinat){let p=String(x.koordinat).split(',');lat=p[0]?.trim()||'';lon=p[1]?.trim()||'';$('gps').textContent='GPS master: '+lat+', '+lon}}function ambilGPS(){if(!navigator.geolocation)return msg('Browser tidak mendukung GPS','err');$('gps').textContent='Mengambil lokasi...';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;$('gps').textContent='GPS: '+lat+', '+lon},e=>msg('GPS gagal: '+e.message,'err'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}function preview(inp,id){let f=inp.files[0];if(!f)return;let im=$(id);im.src=URL.createObjectURL(f);im.classList.remove('hidden')}function compress(file,max=1600,q=.72){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=e.target.result};r.readAsDataURL(file)})}async function simpan(){try{if(!$('petugas').value)throw Error('Petugas wajib dipilih');if(!lat||!lon)throw Error('Ambil koordinat GPS terlebih dahulu');if(!$('fotoUtama').files[0])throw Error('Foto utama wajib diambil');msg('Menyimpan...');let d={};['petugas','unit','alamat','gardu','tiang','jenisLampu','daya1','daya2','daya3','daya4','daya5','kondisiLampu','kondisiArmatur','kondisiTiang','kondisiKabel','kondisiGardu','statusPju','temuan','tindakLanjut','prioritas','statusPekerjaan','keterangan'].forEach(k=>d[k]=$(k).value);d.latitude=lat;d.longitude=lon;d.fotoUtama=await compress($('fotoUtama').files[0]);if($('fotoPanel').files[0])d.fotoPanel=await compress($('fotoPanel').files[0]);if($('fotoPerbaikan').files[0])d.fotoPerbaikan=await compress($('fotoPerbaikan').files[0]);google.script.run.withSuccessHandler(r=>{msg('Berhasil disimpan. ID: <b>'+r.id+'</b>');reset()}).withFailureHandler(e=>msg(e.message,'err')).saveInspection(d)}catch(e){msg(e.message,'err')}}function reset(){['search','unit','alamat','gardu','tiang','jenisLampu','daya1','daya2','daya3','daya4','daya5','temuan','tindakLanjut','keterangan'].forEach(k=>$(k).value='');['fotoUtama','fotoPanel','fotoPerbaikan'].forEach(k=>$(k).value='');lat=lon='';$('gps').textContent='Belum mengambil lokasi'}load();</script></body></html>
